<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — IUT Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','ui-monospace','monospace']}}}}</script>
  <style>body{font-family:'Inter',system-ui,sans-serif;}</style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-sm px-4">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-600 rounded-xl mb-4">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
      </div>
      <h1 class="text-xl font-semibold text-gray-900">IUT — Administration</h1>
      <p class="mt-1 text-sm text-gray-400">Espace validateur</p>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
      <div id="error-msg" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2.5 flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="error-text">Identifiants incorrects.</span>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Adresse e-mail</label>
          <input id="email" type="email" placeholder="admin@iut-info.fr" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition-colors" onkeydown="if(event.key==='Enter')handleLogin()">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
          <input id="password" type="password" placeholder="••••••••" class="w-full text-sm border border-gray-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-400 transition-colors" onkeydown="if(event.key==='Enter')handleLogin()">
        </div>
        <button onclick="handleLogin()" class="w-full py-2.5 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 active:scale-95 transition-all">
          Se connecter
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">Accès réservé aux personnels habilités.<br>Problème de connexion ? Contactez l'administrateur.</p>
  </div>

  <script>
    function handleLogin(){
      const email=document.getElementById('email').value.trim();
      const pw=document.getElementById('password').value;
      const err=document.getElementById('error-msg');
      if(!email || !pw){
        err.classList.remove('hidden');err.classList.add('flex');
        document.getElementById('error-text').textContent='Veuillez remplir tous les champs.';
        return;
      }
      err.classList.add('hidden');err.classList.remove('flex');
      window.location.href='dashboard.html';
    }
  </script>
</body>
</html>
