.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .2s,transform .2s,border-color .2s;text-decoration:none;color:inherit;display:block;cursor:pointer}

.cb{padding:1.25rem}.cb-xl{padding:1.5rem}

.cchev{color:#7A7970;flex-shrink:0;transition:transform .2s,color .2s}.card:hover .cchev{transform:translateX(3px);color:#1F6F4A}
.ncenter{display:flex;flex-direction:column;align-items:center;text-align:center;padding:1.5rem}
.nico{width:3.5rem;height:3.5rem;border-radius:1rem;background:rgba(31,111,74,.1);display:flex;align-items:center;justify-content:center;margin-bottom:1rem}
.nabbr{font-family:'Lora',serif;font-size:1.875rem;font-weight:700}

.nsem{font-size:.75rem;color:rgba(122,121,112,.7);margin-top:.25rem;font-family:'JetBrains Mono',monospace}
.chip{display:inline-block;background:rgba(31,111,74,.1);color:#1F6F4A;font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;padding:.2rem .5rem;border-radius:.25rem;margin-bottom:.5rem}
.sem-ico{width:3rem;height:3rem;border-radius:.75rem;background:#1F6F4A;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1rem;flex-shrink:0}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:2.25rem;height:1.5rem;padding:0 .375rem;border-radius:.25rem;font-size:.75rem;font-weight:700;font-family:'JetBrains Mono',monospace}
.bdg-v{background:#f0fdf4;color:#15803d;box-shadow:inset 0 0 0 1px #bbf7d0}
.bdg-star{background:#fffbeb;color:#b45309;box-shadow:inset 0 0 0 1px #fde68a}
.bdg-nv{background:#fef2f2;color:#b91c1c;box-shadow:inset 0 0 0 1px #fecaca}
.sstrip{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.sbox{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:.5rem;padding:.625rem 1rem;text-align:center}
.sbox .sv{font-family:'JetBrains Mono',monospace;font-size:1.125rem;font-weight:700}
.sbox .sl{font-size:.6875rem;color:#7A7970}
.sbox-g{background:#f0fdf4;border-color:#dcfce7}.sbox-g .sv{color:#15803d}
.sbox-r{background:#fef2f2;border-color:#fecaca}.sbox-r .sv{color:#b91c1c}
.twrap{border-radius:.75rem;border:1px solid rgba(0,0,0,.08);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
thead{background:#1F6F4A;color:#fff}
th{padding:.75rem;font-size:.6875rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600;white-space:nowrap}
td{padding:.75rem}

tbody tr:hover{background:rgba(0,0,0,.02)}
tbody tr:nth-child(even){background:rgba(0,0,0,.015)}
.tr{text-align:right}.tc{text-align:center}.tl{text-align:left}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:#7A7970}
.tftr{padding:.625rem 1rem;background:rgba(0,0,0,.02);border-top:1px solid rgba(0,0,0,.06);font-size:.75rem;color:#7A7970;display:flex;justify-content:space-between}
.legend{display:flex;align-items:center;gap:1rem;margin-bottom:.75rem;flex-wrap:wrap;font-size:.75rem;color:#7A7970}
.legend-item{display:flex;align-items:center;gap:.375rem}
.lswatch{width:1rem;height:1rem;border-radius:.25rem}
.fpanel{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:.75rem;padding:1.25rem;margin-bottom:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
@media(max-width:640px){.fgrid{grid-template-columns:repeat(2,1fr)}}
.flbl{display:block;font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#7A7970;margin-bottom:.375rem}
.finput{width:100%;border:1px solid rgba(0,0,0,.1);border-radius:.5rem;padding:.625rem .875rem;font-size:.875rem;font-family:inherit;color:#2B2B28;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.finput:focus{border-color:rgba(31,111,74,.4);box-shadow:0 0 0 3px rgba(31,111,74,.1)}
.finput:disabled{opacity:.4;cursor:not-allowed;background:#F7F7F2}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:640px){.frow{grid-template-columns:1fr}}
.flabel{display:block;font-size:.875rem;font-weight:500;margin-bottom:.375rem}
.fgroup{margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;gap:.375rem;padding:.625rem 1rem;border-radius:.5rem;font-size:.875rem;font-weight:600;cursor:pointer;border:none;text-decoration:none;transition:opacity .15s;color:#fff;font-family:inherit}
.btn:hover{opacity:.9}.btn-p{background:#1F6F4A}.btn-sm{padding:.375rem .75rem;font-size:.75rem}
.srch-wrap{position:relative}
.srch-input{width:100%;padding:.5rem 2rem .5rem 2rem;border:1px solid rgba(0,0,0,.08);border-radius:.5rem;font-size:.875rem;background:#fff;outline:none;font-family:inherit;color:#2B2B28}
.srch-input:focus{border-color:rgba(31,111,74,.3);box-shadow:0 0 0 3px rgba(31,111,74,.1)}
.srch-ico{position:absolute;left:.625rem;top:50%;transform:translateY(-50%);color:#7A7970;pointer-events:none}
.profhdr{background:#1F6F4A;color:#fff;border-radius:.75rem;padding:1.25rem;margin-bottom:1.5rem}
.prof-mat{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:rgba(255,255,255,.45);margin-bottom:.25rem}
.prof-name{font-family:'Lora',serif;font-size:1.25rem;font-weight:700}
.prof-fil{font-size:.875rem;color:rgba(255,255,255,.6);margin-top:.25rem}
.semblk{margin-bottom:1.25rem}
.sem-label{font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#7A7970;margin-bottom:.5rem}
.uenum{width:1.75rem;height:1.75rem;border-radius:50%;background:#EDECE7;color:#7A7970;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:500;flex-shrink:0}
.qtile{padding:1.25rem;display:flex;align-items:center;gap:1rem}
.qtile-ico{width:2.5rem;height:2.5rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.unavail{font-size:.7rem;background:#EDECE7;color:#7A7970;padding:.15rem .5rem;border-radius:100px;white-space:nowrap}
.err-box{text-align:center;padding:4rem 1rem;color:#7A7970}
.success{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:.75rem;padding:2.5rem 1.5rem;text-align:center}
.success h3{color:#15803d;font-size:1.125rem;margin-bottom:.5rem}
.success p{color:#16a34a;font-size:.875rem}
.pbar{height:6px;background:#EDECE7;border-radius:3px;overflow:hidden;max-width:16rem}
.pfill{height:100%;border-radius:3px}.pfill-g{background:#22c55e}.pfill-r{background:#f87171}

<body>
<header class="hdr">
  <div class="hdr-in">
    <a href="index.html" class="hdr-logo">
      <div class="hdr-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg></div>
      <div><div class="hdr-name">Résultats ENA</div><div class="hdr-sub">École Nationale d'Administration · Bénin</div></div>
    </a>
    <nav class="hdr-nav">

      <a href="releve.html">Mon Relevé</a>

    </nav>
  </div>
</header>
<div class="wrap" id="root"><noscript>JavaScript est requis pour cette page.</noscript></div>
<footer class="ftr">
  <div class="ftr-in">
    <span>© 2026 École Nationale d'Administration — République du Bénin</span>
    <span>Plateforme officielle de résultats académiques</span>
  </div>
</footer>
<script>
const ANNEES=[{id:'2025-2026',available:true},{id:'2024-2025',available:true},{id:'2023-2024',available:false}];
const NIVEAUX=[{id:'L1',label:'Licence 1',semestres:['S1','S2']},{id:'L2',label:'Licence 2',semestres:['S3','S4']},{id:'L3',label:'Licence 3',semestres:['S5','S6']}];
const FILIERES=[
  {id:'adfi',label:'Administration des Finances',abbr:'ADFI'},
  {id:'adim',label:'Administration des Impôts',abbr:'ADIM'},
  {id:'secg',label:'Secrétariat de Gestion',abbr:'SECG'},
  {id:'stid',label:"Sciences et Technologies de l'Information et de la Documentation",abbr:'STID'},
];
const UES={
  S1:[{id:'droit-const',label:'Droit Constitutionnel',credits:3},{id:'eco-gene',label:'Économie Générale',credits:3},{id:'compta-pub',label:'Comptabilité Publique',credits:3},{id:'math-fi',label:'Mathématiques Financières',credits:3},{id:'francais',label:'Français & Expression Écrite',credits:2},{id:'anglais',label:'Anglais Professionnel',credits:2}],
  S2:[{id:'droit-adm',label:'Droit Administratif Général',credits:3},{id:'fi-pub',label:'Finances Publiques',credits:3},{id:'stat',label:'Statistiques Appliquées',credits:3},{id:'info-gest',label:'Informatique de Gestion',credits:3},{id:'rh',label:'Gestion des Ressources Humaines',credits:2},{id:'comm-adm',label:'Communication Administrative',credits:2}],
  S3:[{id:'fiscalite',label:'Fiscalité Appliquée',credits:4},{id:'budget-etat',label:"Budget de l'État",credits:3},{id:'audit-pub',label:'Audit du Secteur Public',credits:3},{id:'droit-fisc',label:'Droit Fiscal',credits:3},{id:'compta-anal',label:'Comptabilité Analytique',credits:3}],
  S4:[{id:'douanes',label:'Réglementation Douanière',credits:4},{id:'tresor',label:'Trésorerie et Comptabilité Publique',credits:3},{id:'controle-fi',label:'Contrôle Financier',credits:3},{id:'si-fin',label:"Systèmes d'Information Financière",credits:3},{id:'droit-comm',label:'Droit Commercial et des Affaires',credits:3}],
  S5:[{id:'fi-int',label:'Finances Internationales',credits:4},{id:'gestion-proj',label:'Gestion de Projets Publics',credits:4},{id:'droit-intl',label:'Droit International Public',credits:3},{id:'mgmt-pub',label:'Management Public',credits:3},{id:'ethique',label:'Éthique et Déontologie Administrative',credits:2}],
  S6:[{id:'stage',label:"Stage de Fin d'Études",credits:10},{id:'memoire',label:'Rapport de Stage et Soutenance',credits:8}],
};
const SESSIONS=[{id:'normale',label:'Session Normale'},{id:'rattrapage',label:'Session de Rattrapage'}];
const PRENOMS=['Alain','Marie-Claire','Jean-Baptiste','Fatou','Pierre','Sandrine','Rodrigue','Clarisse','Nadège','Franck','Aimée','Constant','Laure','Éric','Viviane','Serge','Joëlle','Patrick','Elvira','Christian','Yvonne','Gaëtan','Sylvie','Marcel','Rosette','André','Juliette','Lionel'];
const NOMS_LIST=['MOUSSAVOU','MBOUMBA','NZENG','OBAME','NKOGHE','NGUEMA','BONGO ONDO','EDOU','MEZUI','MOUELE','NKOULOU','ASSOUMOU','MIBENGUE','AKUE','BIKORO','NDONG','OGOULIGUENDE','ONDO MEBA','EYEGHE','MVONDO','MENGUE','ABESSOLO','BENGONE','NTUTUMU','MINKUE','OBIANG','NTOUTOUME','EKOMI'];
function stringHash(str){return Array.from(str).reduce((a,c)=>a+c.charCodeAt(0),0);}
function seededRng(seed){let s=seed|0;return()=>{s=(Math.imul(s,1664525)+1013904223)|0;return(s>>>0)/0xffffffff;};}
function generateRanking(ueId,sem){
  const rng=seededRng(stringHash(ueId+sem));
  return PRENOMS.map((p,i)=>{
    const ec1=Math.round((rng()*12+5)*2)/2;
    const ec2=Math.round((rng()*12+5)*2)/2;
    const moy=+(ec1*0.6+ec2*0.4).toFixed(2);
    const statut=moy>=14?'V*':moy>=10?'V':'NV';
    const yr=2022+Math.floor(i/10);
    return{rang:0,nom:NOMS_LIST[i]+' '+p,matricule:'ENA-'+yr+'-'+String(1001+i*13+stringHash(ueId)).padStart(4,'0'),ec1,ec2,moy,statut};
  }).sort((a,b)=>b.moy-a.moy).map((s,i)=>({...s,rang:i+1}));
}
const P=new URLSearchParams(location.search);
function qs(k){return P.get(k)||'';}
function link(page,params){return page+'?'+new URLSearchParams(params).toString();}
function hesc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}


(function(){
  var annee=qs('annee'),niveau=qs('niveau'),filiere=qs('filiere'),sem=qs('sem'),session=qs('session'),ueId=qs('ue');
  if(!annee||!niveau||!filiere||!sem||!session||!ueId){location.href='index.html';return;}
  var fil=FILIERES.find(function(f){return f.id===filiere;});
  var ue=(UES[sem]||[]).find(function(u){return u.id===ueId;});
  var sesLbl=session==='normale'?'Session Normale':'Rattrapage';
  var ranking=generateRanking(ueId,sem);
  var validated=ranking.filter(function(r){return r.statut!=='NV';}).length;
  var avg=(ranking.reduce(function(s,r){return s+r.moy;},0)/ranking.length).toFixed(2);
  function bdg(s){var cls=s==='V*'?'bdg-star':s==='V'?'bdg-v':'bdg-nv';return '<span class="bdg '+cls+'">'+hesc(s)+'</span>';}
  var rows=ranking.map(function(r){
    var mc=r.moy>=10?'#15803d':'#b91c1c';
    return '<tr class="rrow"><td class="tr mono muted" style="font-size:.75rem">'+r.rang+'</td>'
      +'<td class="mono muted" style="font-size:.75rem;white-space:nowrap">'+hesc(r.matricule)+'</td>'
      +'<td style="font-weight:500">'+hesc(r.nom)+'</td>'
      +'<td class="tc mono">'+r.ec1.toFixed(2)+'</td>'
      +'<td class="tc mono">'+r.ec2.toFixed(2)+'</td>'
      +'<td class="tc mono" style="font-weight:700;color:'+mc+'">'+r.moy.toFixed(2)+'</td>'
      +'<td class="tc">'+bdg(r.statut)+'</td></tr>';
  }).join('');
  document.getElementById('root').innerHTML='<div class="con-w" style="padding-top:.5rem">'
    +'<nav class="crumb"><a href="index.html">Accueil</a><span class="csep">›</span>'
    +'<a href="'+link('niveaux.html',{annee})+'">'+hesc(annee)+'</a><span class="csep">›</span>'
    +'<a href="'+link('filieres.html',{annee,niveau})+'">'+hesc(niveau)+'</a><span class="csep">›</span>'
    +'<a href="'+link('semestres.html',{annee,niveau,filiere})+'">'+hesc(fil.abbr)+'</a><span class="csep">›</span>'
    +'<a href="'+link('sessions.html',{annee,niveau,filiere,sem})+'">'+hesc(sem)+'</a><span class="csep">›</span>'
    +'<a href="'+link('matieres.html',{annee,niveau,filiere,sem,session})+'">'+hesc(sesLbl)+'</a><span class="csep">›</span>'
    +'<span class="ccur">'+(ue?hesc(ue.label):hesc(ueId))+'</span></nav>'
    +'<h2 class="stitle">'+(ue?hesc(ue.label):hesc(ueId))+'</h2>'
    +'<p class="ssub">'+hesc(sesLbl)+' · '+hesc(sem)+' · '+hesc(fil.abbr)+' · '+hesc(annee)+(ue?' · '+ue.credits+' crédit'+(ue.credits>1?'s':''):'')+'</p>'
    +'<div class="sstrip">'
    +'<div class="sbox"><div class="sv">'+ranking.length+'</div><div class="sl">Inscrits</div></div>'
    +'<div class="sbox sbox-g"><div class="sv">'+validated+'</div><div class="sl">Validés</div></div>'
    +'<div class="sbox sbox-r"><div class="sv">'+(ranking.length-validated)+'</div><div class="sl">Non Validés</div></div>'
    +'<div class="sbox"><div class="sv">'+avg+'</div><div class="sl">Moy. générale</div></div>'
    +'</div>'
    +'<div class="legend">'
    +'<div class="legend-item"><div class="lswatch" style="background:#f0fdf4;box-shadow:inset 0 0 0 1px #bbf7d0"></div>V = Validé</div>'
    +'<div class="legend-item"><div class="lswatch" style="background:#fffbeb;box-shadow:inset 0 0 0 1px #fde68a"></div>V* = Validé avec mention</div>'
    +'<div class="legend-item"><div class="lswatch" style="background:#fef2f2;box-shadow:inset 0 0 0 1px #fecaca"></div>NV = Non Validé</div>'
    +'</div>'
    +'<div style="display:flex;justify-content:flex-end;margin-bottom:.75rem">'
    +'<div class="srch-wrap" style="width:16rem">'
    +'<div class="srch-ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>'
    +'<input class="srch-input" id="q" placeholder="Rechercher un étudiant…" oninput="filterRows(this.value)">'
    +'</div></div>'
    +'<div class="twrap"><div class="tscroll"><table>'
    +'<thead><tr><th class="tr" style="width:2.5rem">N°</th><th class="tl" style="width:10rem">Matricule</th><th class="tl">Nom &amp; Prénoms</th><th class="tc" style="width:4rem">EC1</th><th class="tc" style="width:4rem">EC2</th><th class="tc" style="width:5rem">Moy. UE</th><th class="tc" style="width:4.5rem">Statut</th></tr></thead>'
    +'<tbody id="rk-body">'+rows+'</tbody>'
    +'</table></div>'
    +'<div class="tftr"><span id="rk-count">'+ranking.length+' résultats affichés</span><span>Classé par ordre de mérite décroissant</span></div>'
    +'</div>'
    +'</div>';
  window.filterRows=function(q){q=q.toLowerCase();var rs=document.querySelectorAll('#rk-body .rrow'),v=0;rs.forEach(function(r){var ok=!q||r.textContent.toLowerCase().includes(q);r.style.display=ok?'':'none';if(ok)v++;});document.getElementById('rk-count').textContent=v+' résultat'+(v!==1?'s':'')+' affiché'+(v!==1?'s':'');};
})();

</script>
