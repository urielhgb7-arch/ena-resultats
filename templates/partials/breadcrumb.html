<nav class="text-sm text-neutral-500 mb-6 flex flex-wrap gap-1">
    {% for item in breadcrumb %}
        {% if not forloop.last %}
            <a href="{{ item.url }}" class="hover:text-emerald-700 hover:underline">{{ item.label }}</a>
            <span class="mx-1">&gt;</span>
        {% else %}
            <span class="text-neutral-800 font-medium">{{ item.label }}</span>
        {% endif %}
    {% endfor %}
</nav>
