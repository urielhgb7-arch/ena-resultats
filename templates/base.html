<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Résultats ENA{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-neutral-50 text-neutral-800 min-h-screen flex flex-col">

    {% include "partials/header.html" %}

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
        {% if breadcrumb %}
            {% include "partials/breadcrumb.html" %}
        {% endif %}

        {% for message in messages %}
            <div class="mb-4 p-3 rounded-lg
                {% if message.tags == 'error' %}bg-red-50 text-red-700
                {% else %}bg-green-50 text-green-700{% endif %}">
                {{ message }}
            </div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}
</body>
</html>
